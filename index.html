    <!-- Non-blocking preconnect for fonts and critical assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>

    <!-- Trusted Types DOM Policy for CSP compliance without blocking script execution -->
    <script>
      // Cleanly suppress harmless Vite HMR idle websocket closures in AI Studio preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason?.message).includes('WebSocket'))) {
          event.preventDefault();
        }
      });

      if (window.trustedTypes && window.trustedTypes.createPolicy) {
        try {
          if (!window.trustedTypes.defaultPolicy) {
            window.trustedTypes.createPolicy('default', {
              createHTML: function(s) { return s; },
              createScript: function(s) { return s; },
              createScriptURL: function(s) { return s; }
            });
          }
        } catch (e) {
          // Policy already exists or browser restricted
        }
      }
    </script>

    <!-- Deferred dynamic environment configuration to eliminate render blocking (saves ~680ms) -->
    <script src="/supabase-env.js" defer></script>

    <!-- Schema.org Structured Data (JSON-LD) for Lodging & Web Application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Roomia PMS",
      "url": "https://www.roomiapms.site",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "Sistema de gestión de propiedades y motor de reservas para hoteles boutique y propiedades exclusivas.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
