<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071726" />

    <!-- Etiquetas SEO de la página. El build (vite.config.ts) y api/seo.ts reemplazan todo lo que
         hay entre estos marcadores según la ruta; los textos salen de PAGES en api/seo.ts. -->
    <!--seo:start-->
    <title>Roomia PMS – Hoteles, casas y departamentos con reserva directa</title>
    <meta name="description" content="Reserva directo con hoteles, casas y departamentos en Ecuador, sin comisiones de intermediarios. Roomia PMS es la plataforma de gestión y reservas para anfitriones." />
    <link rel="canonical" href="https://www.roomiapms.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roomia PMS" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:url" content="https://www.roomiapms.site/" />
    <meta property="og:title" content="Roomia PMS – Hoteles, casas y departamentos con reserva directa" />
    <meta property="og:description" content="Reserva directo con hoteles, casas y departamentos en Ecuador, sin comisiones de intermediarios. Roomia PMS es la plataforma de gestión y reservas para anfitriones." />
    <meta property="og:image" content="https://www.roomiapms.site/og-roomia.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.roomiapms.site/og-roomia.png" />
    <!--seo:end-->

    <!-- High Performance Favicon & Icons -->
    <link rel="icon" type="image/webp" href="/favicon-32x32.webp" />
    <link rel="alternate icon" type="image/png" href="/RoomiaPMSLogoSinFondo.png" />
    <link rel="apple-touch-icon" href="/RoomiaPMSLogoSinFondo.png" />

    <!-- Non-blocking preconnect for fonts and critical assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>

    <!-- Trusted Types DOM Policy for CSP compliance without blocking script execution -->
    <script>
      // Cleanly suppress harmless Vite HMR idle websocket closures in AI Studio preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason?.message).includes('WebSocket'))) {
          event.preventDefault();
        }
      });

      if (window.trustedTypes && window.trustedTypes.createPolicy) {
        try {
          if (!window.trustedTypes.defaultPolicy) {
            window.trustedTypes.createPolicy('default', {
              createHTML: function(s) { return s; },
              createScript: function(s) { return s; },
              createScriptURL: function(s) { return s; }
            });
          }
        } catch (e) {
          // Policy already exists or browser restricted
        }
      }
    </script>

    <!-- Deferred dynamic environment configuration to eliminate render blocking (saves ~680ms) -->
    <script src="/supabase-env.js" defer></script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
